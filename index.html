<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLHS QUIZ - 電腦軟體應用丙級線上測驗系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./questions.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#F3F6FB] text-slate-700 min-h-screen font-sans flex flex-col items-center">

  <!-- 頂部導覽列 Navbar -->
  <nav class="w-full bg-white border-b border-slate-200 py-3.5 px-6 md:px-12 flex justify-between items-center sticky top-0 z-30">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-paper-plane text-indigo-600 text-xl"></i>
      <span class="font-black text-xl tracking-wider text-slate-800">SLHS QUIZ</span>
    </div>

    <!-- 使用者資訊 -->
    <div id="nav-user-bar" class="hidden flex items-center gap-3">
      <div class="flex items-center gap-2">
        <div id="user-avatar" class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center text-xs font-bold shadow-sm">H</div>
        <span id="user-display-name" class="text-sm font-semibold text-slate-700 max-w-[150px] truncate">同學</span>
      </div>
      <button id="btn-logout" class="text-xs font-medium text-slate-400 hover:text-red-500 transition ml-2">登出</button>
    </div>
  </nav>

  <!-- 主容器 -->
  <main class="w-full max-w-5xl p-4 md:p-8 flex-1">

    <!-- 1. 登入視圖 -->
    <section id="view-login" class="flex flex-col items-center justify-center py-20">
      <div class="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-slate-200 max-w-md w-full text-center">
        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-5">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-800 mb-2">電腦軟體應用丙級</h2>
        <p class="text-xs text-slate-500 mb-8 leading-relaxed">請使用 Google 帳號登入系統，系統將自動記錄作答統計、題庫涵蓋率與錯題本。</p>
        
        <button id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-2xl shadow-md transition flex items-center justify-center gap-3 text-sm">
          <i class="fa-brands fa-google text-base"></i> 使用 Google 帳號登入
        </button>
      </div>
    </section>

    <!-- 2. 儀表板視圖 (NKSH 風格) -->
    <section id="view-dashboard" class="hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- 左側數據看板 (7格) -->
        <div class="lg:col-span-7 space-y-4">
          <div>
            <h2 class="text-2xl md:text-3xl font-black text-slate-800">
              丙級學科題庫 <span id="dash-accuracy" class="text-indigo-600 font-extrabold">(正確率 0.0%)</span>
            </h2>
            <p id="dash-preference-hint" class="text-xs text-slate-400 mt-1">系統已記住您的偏好：不指定類別 / 40 題</p>
          </div>

          <!-- 統計方塊 -->
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div class="text-xs font-semibold text-slate-400">總測驗次數</div>
              <div class="text-3xl font-black text-slate-800 mt-2" id="dash-exam-count">0</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div class="text-xs font-semibold text-slate-400">已答題量 (累計)</div>
              <div class="text-3xl font-black text-slate-800 mt-2"><span id="dash-total-answered">0</span> <span class="text-xs font-bold text-slate-400">題</span></div>
            </div>
          </div>

          <!-- 錯題回顧 -->
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
            <div>
              <div class="text-xs font-semibold text-slate-400">錯題回顧 (專業操作證題庫)</div>
              <div class="text-3xl font-black text-rose-500 mt-2"><span id="dash-wrong-count">0</span> <span class="text-xs font-bold text-slate-400">題待複習</span></div>
            </div>
            <button id="btn-filter-wrong-direct" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-1.5 border border-rose-200">
              <i class="fa-solid fa-list-check"></i> 查看詳情
            </button>
          </div>

          <!-- 題庫涵蓋率 -->
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <div class="flex justify-between items-center text-xs font-bold text-slate-500">
              <span>題庫涵蓋率 (佔 <span id="dash-coverage-percent">0</span> %)</span>
              <span class="text-indigo-600 font-extrabold" id="dash-coverage-ratio">0 / 668</span>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div id="dash-coverage-bar" class="bg-indigo-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>

          <!-- 最近作答時間 -->
          <div class="bg-[#1E293B] text-white p-4 rounded-2xl flex justify-between items-center text-xs shadow-sm">
            <div>
              <span class="text-slate-400 block mb-1">最近作答日期</span>
              <span id="dash-last-date" class="font-mono text-sm font-bold text-slate-200">無紀錄</span>
            </div>
            <i class="fa-regular fa-calendar-check text-2xl text-slate-500"></i>
          </div>
        </div>

        <!-- 右側開始練習面板 (5格) -->
        <div class="lg:col-span-5 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-5">
          <div class="flex items-center gap-2 font-black text-slate-800 text-base">
            <i class="fa-solid fa-circle-play text-indigo-600"></i> 開始練習
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 mb-2">題庫類別</label>
            <select id="config-category" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-indigo-600">
              <option value="all">不指定類別 (目前題庫混合)</option>
              <option value="工作項目01">工作項目 01：電腦概論 (305 題)</option>
              <option value="工作項目02">工作項目 02：應用軟體使用 (61 題)</option>
              <option value="工作項目03">工作項目 03：系統軟體使用 (255 題)</option>
              <option value="工作項目04">工作項目 04：資訊安全 (47 題)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 mb-2">隨機題數 (已記住您的選擇)</label>
            <div class="grid grid-cols-4 gap-2">
              <button type="button" class="btn-qcount py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:border-indigo-600 transition" data-count="10">10</button>
              <button type="button" class="btn-qcount py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:border-indigo-600 transition" data-count="20">20</button>
              <button type="button" class="btn-qcount py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:border-indigo-600 transition" data-count="30">30</button>
              <button type="button" class="btn-qcount py-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-50/50 text-indigo-600 text-xs font-bold transition" data-count="40">40</button>
            </div>
          </div>

          <div class="pt-2 border-t border-slate-100">
            <label class="flex items-center justify-between cursor-pointer">
              <div>
                <span class="text-xs font-bold text-slate-700 block">只挑選答錯的題目進行複習</span>
                <span class="text-[11px] text-slate-400">此題庫累積錯誤：<span id="label-wrong-accumulate">0</span> 題</span>
              </div>
              <input type="checkbox" id="toggle-wrong-only" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            </label>
          </div>

          <button id="btn-start" class="w-full bg-[#4F46E5] hover:bg-[#4338CA] text-white font-extrabold py-3.5 rounded-2xl shadow-md transition duration-150 text-sm">
            開始測驗
          </button>
        </div>

      </div>
    </section>

    <!-- 3. 作答中卡片視圖 -->
    <section id="view-exam" class="hidden max-w-3xl mx-auto space-y-4">
      <div class="flex justify-between items-center text-xs font-bold">
        <button id="btn-quit-exam" class="text-slate-400 hover:text-red-500 transition flex items-center gap-1.5">
          <i class="fa-regular fa-circle-xmark"></i> 終止測驗
        </button>
        <div class="bg-indigo-50 text-indigo-600 border border-indigo-100 px-3 py-1 rounded-full font-mono">
          題號 <span id="exam-progress-index">1</span> / <span id="exam-progress-total">40</span>
        </div>
      </div>

      <div class="bg-white rounded-3xl p-6 md:p-10 border border-slate-200 shadow-sm space-y-6">
        <div class="flex items-center gap-2">
          <span id="exam-cat-tag" class="text-xs font-bold text-indigo-600"></span>
          <span id="exam-original-id" class="text-xs text-indigo-400 font-mono"></span>
        </div>

        <h2 id="exam-question-title" class="text-lg md:text-xl font-bold text-slate-800 leading-relaxed"></h2>
        <div id="exam-options-text-list" class="space-y-3 pl-1 text-sm md:text-base text-slate-600 leading-relaxed font-normal"></div>

        <div class="pt-6 border-t border-slate-100">
          <div class="grid grid-cols-4 gap-3 md:gap-4">
            <button type="button" class="btn-select-opt group bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-600 rounded-2xl py-4 flex flex-col items-center justify-center transition" data-val="0">
              <span class="text-xl md:text-2xl font-black text-slate-700 group-hover:text-indigo-600">1</span>
              <span class="text-[10px] text-slate-400 group-hover:text-indigo-500 mt-1 font-bold">選擇此項</span>
            </button>
            <button type="button" class="btn-select-opt group bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-600 rounded-2xl py-4 flex flex-col items-center justify-center transition" data-val="1">
              <span class="text-xl md:text-2xl font-black text-slate-700 group-hover:text-indigo-600">2</span>
              <span class="text-[10px] text-slate-400 group-hover:text-indigo-500 mt-1 font-bold">選擇此項</span>
            </button>
            <button type="button" class="btn-select-opt group bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-600 rounded-2xl py-4 flex flex-col items-center justify-center transition" data-val="2">
              <span class="text-xl md:text-2xl font-black text-slate-700 group-hover:text-indigo-600">3</span>
              <span class="text-[10px] text-slate-400 group-hover:text-indigo-500 mt-1 font-bold">選擇此項</span>
            </button>
            <button type="button" class="btn-select-opt group bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-600 rounded-2xl py-4 flex flex-col items-center justify-center transition" data-val="3">
              <span class="text-xl md:text-2xl font-black text-slate-700 group-hover:text-indigo-600">4</span>
              <span class="text-[10px] text-slate-400 group-hover:text-indigo-500 mt-1 font-bold">選擇此項</span>
            </button>
          </div>
        </div>
      </div>

      <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
        <div id="exam-top-progressbar" class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: 2%"></div>
      </div>
    </section>

    <!-- 4. 測驗結算與作答詳情 (完全 1:1 復刻) -->
    <section id="view-report" class="hidden max-w-3xl mx-auto space-y-8">
      
      <!-- 結算頂部大白卡 -->
      <div class="bg-white rounded-3xl p-8 md:p-10 border border-slate-200 shadow-sm text-center space-y-6">
        <div>
          <h2 class="text-2xl md:text-3xl font-black text-slate-800 mb-1">測驗結算</h2>
          <p class="text-xs text-slate-400">您的練習紀錄已同步至資料庫</p>
        </div>

        <!-- 雙數據方塊 (正解題數 / 本次題數) -->
        <div class="flex justify-center gap-4 max-w-md mx-auto">
          <div class="flex-1 bg-slate-50/80 rounded-2xl p-4 border border-slate-100">
            <div class="text-xs font-semibold text-slate-400 mb-1">正確答題</div>
            <div class="text-3xl md:text-4xl font-black text-emerald-500 font-mono" id="report-correct-num">0</div>
          </div>
          <div class="flex-1 bg-slate-50/80 rounded-2xl p-4 border border-slate-100">
            <div class="text-xs font-semibold text-slate-400 mb-1">本次題數</div>
            <div class="text-3xl md:text-4xl font-black text-slate-800 font-mono" id="report-total-num">0</div>
          </div>
        </div>

        <!-- 返回儀表板按鈕 -->
        <div>
          <button id="btn-report-back" class="bg-[#4F46E5] hover:bg-[#4338CA] text-white font-extrabold text-sm py-3.5 px-10 rounded-2xl shadow-md transition duration-150 flex items-center gap-2 mx-auto">
            <i class="fa-solid fa-house text-xs"></i> 返回儀表板
          </button>
        </div>
      </div>

      <!-- 下方本次作答詳情清單 -->
      <div class="space-y-4">
        <div class="flex items-center gap-2 font-black text-slate-800 text-base">
          <i class="fa-solid fa-list-check text-indigo-600"></i> 本次作答詳情
        </div>

        <!-- 題目列表動態容器 -->
        <div id="report-question-list" class="space-y-4"></div>
      </div>

    </section>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithRedirect, 
      getRedirectResult, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAeeI3DJF1rp6BXDLOHEHS9Q7QPC7U4NNC",
      authDomain: "slhs-quiz.firebaseapp.com",
      projectId: "slhs-quiz",
      storageBucket: "slhs-quiz.firebasestorage.app",
      messagingSenderId: "494133593229",
      appId: "1:494133593229:web:48419b8f2381f033468ec4",
      measurementId: "G-M6ZZBY9ZHS"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const QUESTION_BANK = window.QUESTION_BANK || [];

    let currentUser = null;
    let userData = {
      wrongList: [],
      answeredHistory: [],
      totalExams: 0,
      totalAnswered: 0,
      correctCount: 0,
      lastDate: null
    };

    let currentSelectedCount = 40;
    let activeExamPool = [];
    let examUserRecords = [];
    let examCurrentIndex = 0;

    function showView(viewId) {
      ["view-login", "view-dashboard", "view-exam", "view-report"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      document.getElementById(viewId).classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    getRedirectResult(auth).catch(err => {
      console.error("登入轉址失敗：", err);
      alert(`登入發生異常：${err.message}`);
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("nav-user-bar").classList.remove("hidden");
        document.getElementById("user-display-name").textContent = user.displayName || "同學";
        document.getElementById("user-avatar").textContent = (user.displayName || "U").charAt(0).toUpperCase();

        await loadUserData();
        updateDashboardUI();
        showView("view-dashboard");
      } else {
        currentUser = null;
        document.getElementById("nav-user-bar").classList.add("hidden");
        showView("view-login");
      }
    });

    document.getElementById("btn-login").onclick = () => signInWithRedirect(auth, provider);
    document.getElementById("btn-logout").onclick = () => signOut(auth);

    async function loadUserData() {
      const userRef = doc(db, "quiz_profiles", currentUser.uid);
      const snap = await getDoc(userRef);
      if (snap.exists()) {
        userData = Object.assign(userData, snap.data());
      } else {
        await setDoc(userRef, userData);
      }
    }

    async function syncUserData() {
      const userRef = doc(db, "quiz_profiles", currentUser.uid);
      await updateDoc(userRef, userData);
    }

    function updateDashboardUI() {
      const accuracy = userData.totalAnswered > 0 
        ? ((userData.correctCount / userData.totalAnswered) * 100).toFixed(1)
        : "0.0";
      
      document.getElementById("dash-accuracy").textContent = `(正確率 ${accuracy}%)`;
      document.getElementById("dash-exam-count").textContent = userData.totalExams || 0;
      document.getElementById("dash-total-answered").textContent = userData.totalAnswered || 0;
      
      const wrongLen = userData.wrongList.length;
      document.getElementById("dash-wrong-count").textContent = wrongLen;
      document.getElementById("label-wrong-accumulate").textContent = wrongLen;

      const covered = userData.answeredHistory ? userData.answeredHistory.length : 0;
      const totalQ = QUESTION_BANK.length || 668;
      const coveragePct = Math.min(100, Math.round((covered / totalQ) * 100));
      document.getElementById("dash-coverage-percent").textContent = coveragePct;
      document.getElementById("dash-coverage-ratio").textContent = `${covered} / ${totalQ}`;
      document.getElementById("dash-coverage-bar").style.width = `${coveragePct}%`;

      document.getElementById("dash-last-date").textContent = userData.lastDate || "尚未作答";
    }

    // 題數按鈕選擇
    document.querySelectorAll(".btn-qcount").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".btn-qcount").forEach(b => {
          b.className = "btn-qcount py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:border-indigo-600 transition";
        });
        btn.className = "btn-qcount py-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-50/50 text-indigo-600 text-xs font-bold transition";
        currentSelectedCount = parseInt(btn.dataset.count, 10);
      };
    });

    document.getElementById("btn-filter-wrong-direct").onclick = () => {
      document.getElementById("toggle-wrong-only").checked = true;
      document.getElementById("btn-start").click();
    };

    // 開始測驗
    document.getElementById("btn-start").onclick = () => {
      const cat = document.getElementById("config-category").value;
      const isWrongOnly = document.getElementById("toggle-wrong-only").checked;

      let pool = QUESTION_BANK;
      if (cat !== "all") {
        pool = pool.filter(q => q.category.includes(cat));
      }

      if (isWrongOnly) {
        pool = pool.filter(q => userData.wrongList.includes(q.id));
        if (pool.length === 0) {
          alert("所選類別目前沒有錯題！請取消勾選「只挑選答錯的題目」。");
          return;
        }
      }

      pool = [...pool].sort(() => 0.5 - Math.random());
      activeExamPool = pool.slice(0, currentSelectedCount);
      examUserRecords = [];
      examCurrentIndex = 0;

      document.getElementById("exam-progress-total").textContent = activeExamPool.length;
      showView("view-exam");
      renderQuestionStep(0);
    };

    function renderQuestionStep(idx) {
      examCurrentIndex = idx;
      const q = activeExamPool[idx];

      document.getElementById("exam-progress-index").textContent = idx + 1;
      document.getElementById("exam-cat-tag").textContent = q.category;
      document.getElementById("exam-original-id").textContent = `(原題號: ${q.id})`;
      document.getElementById("exam-question-title").textContent = q.title;

      const optContainer = document.getElementById("exam-options-text-list");
      optContainer.innerHTML = "";
      q.options.forEach((optText, oIdx) => {
        const div = document.createElement("div");
        div.className = "flex items-start gap-2";
        div.innerHTML = `<span class="font-semibold text-slate-400">(${oIdx + 1})</span> <span>${optText}</span>`;
        optContainer.appendChild(div);
      });

      const pct = Math.round(((idx + 1) / activeExamPool.length) * 100);
      document.getElementById("exam-top-progressbar").style.width = `${pct}%`;
    }

    document.querySelectorAll(".btn-select-opt").forEach(btn => {
      btn.onclick = () => {
        const choice = parseInt(btn.dataset.val, 10);
        processAnswer(choice);
      };
    });

    window.addEventListener("keydown", (e) => {
      if (document.getElementById("view-exam").classList.contains("hidden")) return;
      if (["1", "2", "3", "4"].includes(e.key)) {
        processAnswer(parseInt(e.key, 10) - 1);
      }
    });

    function processAnswer(choice) {
      const q = activeExamPool[examCurrentIndex];
      const isCorrect = (choice === q.answer);

      examUserRecords.push({ q, userChoice: choice, isCorrect });

      if (examCurrentIndex < activeExamPool.length - 1) {
        renderQuestionStep(examCurrentIndex + 1);
      } else {
        finishExam();
      }
    }

    document.getElementById("btn-quit-exam").onclick = () => {
      if (confirm("確定要終止測驗嗎？本次作答將不會計入成績。")) {
        showView("view-dashboard");
      }
    };

    // 測驗結束與結算
    async function finishExam() {
      let correctInThisExam = 0;

      examUserRecords.forEach(record => {
        const qId = record.q.id;

        if (!userData.answeredHistory.includes(qId)) {
          userData.answeredHistory.push(qId);
        }

        if (record.isCorrect) {
          correctInThisExam++;
          if (userData.wrongList.includes(qId)) {
            userData.wrongList = userData.wrongList.filter(id => id !== qId);
          }
        } else {
          if (!userData.wrongList.includes(qId)) {
            userData.wrongList.push(qId);
          }
        }
      });

      userData.totalExams = (userData.totalExams || 0) + 1;
      userData.totalAnswered = (userData.totalAnswered || 0) + examUserRecords.length;
      userData.correctCount = (userData.correctCount || 0) + correctInThisExam;

      const dateObj = new Date();
      userData.lastDate = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')} ${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}:${String(dateObj.getSeconds()).padStart(2, '0')}`;

      await syncUserData();
      updateDashboardUI();

      // 填充結算面板
      document.getElementById("report-correct-num").textContent = correctInThisExam;
      document.getElementById("report-total-num").textContent = examUserRecords.length;

      // 渲染「本次作答詳情」列表 (1:1 復刻紅綠邊條與粉藍對比方塊)
      const listContainer = document.getElementById("report-question-list");
      listContainer.innerHTML = "";

      examUserRecords.forEach((record, idx) => {
        const card = document.createElement("div");
        const isCorrect = record.isCorrect;
        
        // 邊條色彩與圓圈徽章
        const borderClass = isCorrect ? "border-l-4 border-l-emerald-500" : "border-l-4 border-l-rose-500";
        const badgeClass = isCorrect ? "bg-emerald-50 text-emerald-600" : "bg-rose-50 text-rose-500";

        // 選項列表 HTML
        const optionsHtml = record.q.options.map((opt, oIdx) => `
          <div class="flex items-start gap-2 ${oIdx === record.q.answer ? 'font-bold text-slate-800' : 'text-slate-500'}">
            <span>(${oIdx + 1})</span>
            <span>${opt}</span>
          </div>
        `).join("");

        // 你的作答與正確答案標籤
        const userChoiceText = `(${record.userChoice + 1}) ${record.q.options[record.userChoice]}`;
        const correctAnswerText = `(${record.q.answer + 1}) ${record.q.options[record.q.answer]}`;

        card.className = `bg-white rounded-2xl p-6 border border-slate-200 shadow-sm ${borderClass} space-y-4`;
        card.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-7 h-7 rounded-full ${badgeClass} flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">
              ${idx + 1}
            </div>
            <div class="space-y-2 flex-1">
              <div class="text-xs text-indigo-500 font-bold">${record.q.category} (原題號: ${record.q.id})</div>
              <h3 class="font-bold text-slate-800 text-base leading-snug">${record.q.title}</h3>
              
              <!-- 全部選項預覽 -->
              <div class="space-y-1.5 pt-2 text-xs leading-relaxed">
                ${optionsHtml}
              </div>
            </div>
          </div>

          <!-- 對比區塊：您的作答 vs 正確答案 (並列雙色框) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-3 border-t border-slate-100 text-xs font-medium">
            <div class="bg-[#FFF5F5] text-rose-600 p-3.5 rounded-xl border border-rose-100 flex flex-col justify-center">
              <span class="text-[11px] text-rose-400 font-bold mb-1">您的作答</span>
              <span class="font-bold text-sm">${userChoiceText}</span>
            </div>
            <div class="bg-[#F0F7FF] text-blue-700 p-3.5 rounded-xl border border-blue-100 flex flex-col justify-center">
              <span class="text-[11px] text-blue-400 font-bold mb-1">正確答案</span>
              <span class="font-bold text-sm">${correctAnswerText}</span>
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });

      showView("view-report");
    }

    document.getElementById("btn-report-back").onclick = () => {
      showView("view-dashboard");
    };
  </script>
</body>
</html>
