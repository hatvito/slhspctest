<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生線上刷題練習系統</title>
  <!-- 引入 Tailwind CSS 快速排版 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center font-sans">

  <div class="bg-white p-6 rounded-xl shadow-md w-full max-w-lg">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">線上刷題系統</h1>

    <!-- 1. 登入區塊 -->
    <div id="login-section" class="text-center">
      <p class="text-gray-600 mb-4">請先登入 Google 帳號以記錄學習歷程</p>
      <button id="btn-login" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded shadow">
        Google 登入
      </button>
    </div>

    <!-- 2. 主選單與題目區塊 -->
    <div id="quiz-section" class="hidden">
      <!-- 學生資訊列 -->
      <div class="flex justify-between items-center pb-3 mb-4 border-b">
        <div>
          <span id="user-name" class="font-medium text-gray-800"></span>
          <div class="text-xs text-gray-500">錯題庫剩餘：<span id="wrong-count" class="text-red-500 font-bold">0</span> 題</div>
        </div>
        <button id="btn-logout" class="text-sm text-gray-400 hover:text-gray-600">登出</button>
      </div>

      <!-- 模式切換按鈕 -->
      <div class="flex gap-2 mb-6">
        <button id="btn-random-mode" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded font-semibold text-sm">
          隨機練習
        </button>
        <button id="btn-wrong-mode" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-2 rounded font-semibold text-sm">
          重練錯題
        </button>
      </div>

      <!-- 題目顯示區 -->
      <div id="card" class="bg-gray-50 p-4 rounded-lg border">
        <div id="mode-badge" class="text-xs font-semibold px-2 py-1 rounded inline-block mb-2"></div>
        <h2 id="q-title" class="text-lg font-bold text-gray-800 mb-4">點選上方按鈕開始練習</h2>
        <div id="options-container" class="space-y-2"></div>
        <div id="feedback" class="mt-4 text-sm font-medium hidden"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (v10 modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ── 1. 請替換為你的 Firebase 專案設定 ──────────────────────────
    const firebaseConfig = {
     apiKey: "AIzaSyAeel3DJF1mp6BxDE0H5Hs9Q7qPC7U4NNc",
  authDomain: "slhs-quiz.firebaseapp.com",
  projectId: "slhs-quiz",
  storageBucket: "slhs-quiz.firebasestorage.app",
  messagingSenderId: "494133593229",
  appId: "1:494133593229:web:4e419b8f2381f033468ec4",
  measurementId: "G-M6ZZBY9ZHS"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // ── 2. 題目直接放在這裡（老師可自由擴充修改）──────────────────────
    const QUESTION_BANK = [
      { id: 1, title: "下列哪一個是網頁的前端語言？", options: ["Python", "HTML", "C++", "Java"], answer: 1 },
      { id: 2, title: "1 Byte 等於幾個 bit？", options: ["2", "4", "8", "16"], answer: 2 },
      { id: 3, title: "在作業系統中，CPU 是指什麼？", options: ["中央處理器", "主機板", "顯示卡", "電源供應器"], answer: 0 },
      { id: 4, title: "下列哪一個是常見的網路傳輸加密通訊協定？", options: ["HTTP", "HTTPS", "FTP", "TELNET"], answer: 1 }
    ];

    // ── 3. 狀態變數 ───────────────────────────────────────────
    let currentUser = null;
    let currentMode = "random"; // 'random' | 'wrong'
    let currentQuestion = null;
    let wrongIds = [];

    // ── 4. DOM 元素 ──────────────────────────────────────────
    const loginSection = document.getElementById("login-section");
    const quizSection = document.getElementById("quiz-section");
    const userNameSpan = document.getElementById("user-name");
    const wrongCountSpan = document.getElementById("wrong-count");
    const qTitle = document.getElementById("q-title");
    const optionsContainer = document.getElementById("options-container");
    const feedback = document.getElementById("feedback");
    const modeBadge = document.getElementById("mode-badge");

    // ── 5. 認證監聽 ──────────────────────────────────────────
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        loginSection.classList.add("hidden");
        quizSection.classList.remove("hidden");
        userNameSpan.textContent = user.displayName || "同學";
        await loadUserWrongQuestions();
        startRandomPractice();
      } else {
        currentUser = null;
        loginSection.classList.remove("hidden");
        quizSection.classList.add("hidden");
      }
    });

    document.getElementById("btn-login").onclick = () => signInWithPopup(auth, provider);
    document.getElementById("btn-logout").onclick = () => signOut(auth);

    // ── 6. 錯題資料載入與同步 ──────────────────────────────────
    async function loadUserWrongQuestions() {
      const userRef = doc(db, "quiz_users", currentUser.uid);
      const snap = await getDoc(userRef);
      if (snap.exists()) {
        wrongIds = snap.data().wrongList || [];
      } else {
        await setDoc(userRef, { wrongList: [] });
        wrongIds = [];
      }
      wrongCountSpan.textContent = wrongIds.length;
    }

    async function syncWrongQuestions() {
      const userRef = doc(db, "quiz_users", currentUser.uid);
      await updateDoc(userRef, { wrongList: wrongIds });
      wrongCountSpan.textContent = wrongIds.length;
    }

    // ── 7. 出題邏輯 ───────────────────────────────────────────
    document.getElementById("btn-random-mode").onclick = startRandomPractice;
    document.getElementById("btn-wrong-mode").onclick = startWrongPractice;

    function startRandomPractice() {
      currentMode = "random";
      modeBadge.className = "text-xs font-semibold px-2 py-1 rounded inline-block mb-2 bg-indigo-100 text-indigo-700";
      modeBadge.textContent = "隨機出題模式";
      // 隨機選一題
      const randomIndex = Math.floor(Math.random() * QUESTION_BANK.length);
      renderQuestion(QUESTION_BANK[randomIndex]);
    }

    function startWrongPractice() {
      currentMode = "wrong";
      modeBadge.className = "text-xs font-semibold px-2 py-1 rounded inline-block mb-2 bg-amber-100 text-amber-700";
      modeBadge.textContent = "錯題複習模式";

      if (wrongIds.length === 0) {
        qTitle.textContent = "太棒了！目前沒有錯題需要複習。";
        optionsContainer.innerHTML = "";
        feedback.classList.add("hidden");
        return;
      }
      // 從錯題中隨機挑選一題
      const randomWrongId = wrongIds[Math.floor(Math.random() * wrongIds.length)];
      const targetQuestion = QUESTION_BANK.find(q => q.id === randomWrongId);
      renderQuestion(targetQuestion);
    }

    // ── 8. 畫面渲染與作答判斷 ──────────────────────────────────
    function renderQuestion(question) {
      currentQuestion = question;
      feedback.classList.add("hidden");
      qTitle.textContent = question.title;
      optionsContainer.innerHTML = "";

      question.options.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-3 border rounded-lg hover:bg-blue-50 transition duration-150";
        btn.textContent = `${index + 1}. ${optText}`;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
      });
    }

    async function checkAnswer(selectedIndex) {
      const isCorrect = (selectedIndex === currentQuestion.answer);
      feedback.classList.remove("hidden");

      // 停用所有選項避免重複點選
      Array.from(optionsContainer.children).forEach(b => b.disabled = true);

      if (isCorrect) {
        feedback.className = "mt-4 text-sm font-semibold text-green-600";
        feedback.textContent = "答對了！1 秒後進入下一題...";

        // 若在錯題模式答對，從錯題本剔除
        if (wrongIds.includes(currentQuestion.id)) {
          wrongIds = wrongIds.filter(id => id !== currentQuestion.id);
          await syncWrongQuestions();
        }
      } else {
        feedback.className = "mt-4 text-sm font-semibold text-red-600";
        feedback.textContent = `答錯了！正確答案是：${currentQuestion.options[currentQuestion.answer]}。已記入錯題本。`;

        // 答錯加入錯題本
        if (!wrongIds.includes(currentQuestion.id)) {
          wrongIds.push(currentQuestion.id);
          await syncWrongQuestions();
        }
      }

      // 1.5 秒後自動進入下一題
      setTimeout(() => {
        if (currentMode === "random") {
          startRandomPractice();
        } else {
          startWrongPractice();
        }
      }, 1500);
    }
  </script>
</body>
</html>
